[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dalila-mud"
version = "0.1.0"
description = "Dalila-MUD: Python 3 port of the Italian CircleMUD-based MUD"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dalila = "dalila.__main__:main"

[tool.pytest.ini_options]
testpaths = ["dalila/tests"]
